# Maat prod stack: the full live pipeline + serving, fronted by Caddy for TLS.
#
#   postgres + nats        — canonical store + bus
#   kerneld                — the deterministic spine (single writer): folds events → projections,
#                            and applies the embedded migrations on startup
#   extract / classify     — the two streaming stages, each its own scalable service (#298):
#                            long-running durable NATS consumers (LLM judgement), scale per stage
#   acquisition-clock      — scheduled tick: acquire new articles → drain → corroborate (recompute
#                            clusters). Cadence is operator-chosen via MAAT_TICK_INTERVAL.
#   reader                 — the FastAPI app: public /api/* (incl. /api/v2 feed + image proxy) and
#                            the loopback-only admin console
#   marketing              — the public landing page (www.maat.press) + acquisition funnel; a
#                            SEPARATE app from the reader, loopback-only, fronted by Caddy
#   cat-cafe               — OTLP sink: LLM spans (token usage = spend), admin-only UI on :8800
#   caddy                  — the public edge (80/443): /api/* at api.*, the console at admin.* (WG-
#                            gated), and the marketing site at www.maat.press (see Caddyfile)
#
# The reader is bound to 127.0.0.1, so the operator/admin console is reachable only via an SSH
# tunnel — never the open net. Secrets (ANTHROPIC_API_KEY, MISTRAL_API_KEY, APIFY_API_KEY) live in
# .env next to this file and are loaded into the pipeline services via env_file.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maat}
      POSTGRES_DB: ${POSTGRES_DB:-maat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maat}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The deterministic spine (D20): the single writer over Postgres. Consumes maat.events.>,
  # appends to the events log, folds projections (articles/claims/clusters), and runs the
  # embedded sqlx migrations on startup — including 0008 (articles.image_url).
  kerneld:
    build: ./rust
    image: maat-kerneld:local
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-maat}:${POSTGRES_PASSWORD:-maat}@postgres:5432/${POSTGRES_DB:-maat}"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Per-stage streaming workers (#298): extract + classify run as SEPARATE, independently-scalable
  # services off the shared image — `docker compose up -d --scale extract=N --scale classify=M`. Each
  # binds its OWN durable pull consumer (#296) keyed by stage name, so N replicas of a stage share
  # that stage's JetStream work-queue (every event processed once, no fan-out duplication). The heavy
  # stage (extract reads full bodies) thus scales without over-provisioning the lighter one. Reuses
  # the reader image (maat-app:local, built by the reader service); only the command differs.
  extract: &agent-worker
    image: maat-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-maat}:${POSTGRES_PASSWORD:-maat}@postgres:5432/${POSTGRES_DB:-maat}"
      NATS_URL: "nats://nats:4222"
      # LLM spans (model + token usage = spend) → cat-cafe. No-op if cat-cafe is down.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://cat-cafe:4318"
    command: ["uv", "run", "--no-dev", "python", "-m", "maat.agents.extract_agent"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      kerneld:
        condition: service_started

  classify:
    <<: *agent-worker
    command: ["uv", "run", "--no-dev", "python", "-m", "maat.agents.classify_agent"]

  # Ingestion clock (#34): one tick = acquire new articles (GDELT, free) → wait for extract+classify
  # to drain → corroborate (recompute clusters). clock.py is intentionally single-pass; this service
  # is the scheduler wrapper. Cadence is the operator's choice via MAAT_TICK_INTERVAL. A paused clock
  # (admin.clock.set) skips the acquire step. MAAT_PRIMARY_PASS=0 keeps the recurring job free
  # (GDELT only); set it to 1 to add Apify primary-source enrichment per tick (costs credits).
  acquisition-clock:
    image: maat-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-maat}:${POSTGRES_PASSWORD:-maat}@postgres:5432/${POSTGRES_DB:-maat}"
      NATS_URL: "nats://nats:4222"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://cat-cafe:4318"   # corroborate/extremity LLM spend → cat-cafe
      # Operator-tunable. Topics drive what gets acquired; cadence drives cost.
      MAAT_TOPICS: ${MAAT_TOPICS:-global politics,artificial intelligence,new technology emerging,scientific discovery,art,worldwide entertainment,fun and laughter}
      MAAT_TICK_INTERVAL: ${MAAT_TICK_INTERVAL:-10800}   # 3h between ticks
      MAAT_TICK_DRAIN: ${MAAT_TICK_DRAIN:-180}           # let extract+classify catch up before corroborate
      # Apify primary-source enrichment ON (cauri): each tick adds an Apify pass for issuers' own
      # releases the GDELT news stream misses. Costs credits per call. Spend is reported to the
      # operator and (follow-up) surfaced in the admin console. Set to 0 to pause.
      MAAT_PRIMARY_PASS: ${MAAT_PRIMARY_PASS:-1}
      # LLM refinement paths ON (cauri sign-off, #189). These run on SONNET (cauri: quality over
      # the cheap tier) — one call per cluster (NER) / per feedback item (triage) / per unplaced
      # cluster (geo), with the deterministic heuristic/rule pass as the fallback on any error.
      # Spend → cat-cafe via OTLP. Set any to 0 to fall back to the pure heuristic/rule path.
      MAAT_STORY_GRAPH_LLM: ${MAAT_STORY_GRAPH_LLM:-1}   # canonical entity spine for thread attachment (#42)
      MAAT_TRIAGE_LLM: ${MAAT_TRIAGE_LLM:-1}             # feedback category/route refinement (#58/#189)
      MAAT_CURATION_LLM: ${MAAT_CURATION_LLM:-1}         # geo-tag clusters the TLD/lang heuristic can't place (#189)
      MAAT_GROUNDING_LLM: ${MAAT_GROUNDING_LLM:-1}       # judge each primary-bearing cluster vs its primary source (#228)
      MAAT_CONTRADICTION_NLI: ${MAAT_CONTRADICTION_NLI:-1}  # NLI contradiction detection (#229): pinned + smoke-tested ONNX MNLI cross-encoder
      # ── #417 kill switches — both default OFF, both flip on with one env var + redeploy ──
      # THE ENGINE. corroborate died 2026-06-17 on a 30.1 GiB allocation and stayed dead 27 days.
      # The allocation is FIXED (blocked candidate scan; 68k claims now clusters in ~25s / 1.3 GB),
      # but it stays OFF until cauri signs off on turning it back on — the fix is built, not armed.
      MAAT_CORROBORATE_ENABLED: ${MAAT_CORROBORATE_ENABLED:-0}
      # contradiction_agent wedged the whole tick for 6h+ (O(n^2) pure-python nearest_pairs over
      # 12k claims, 100% CPU, 0 rows ever produced) — it is the reason harvest stopped. OFF until
      # nearest_pairs gets the same treatment corroborate just got.
      MAAT_CONTRADICTION_ENABLED: ${MAAT_CONTRADICTION_ENABLED:-0}
      MAAT_NLI_MODEL: ${MAAT_NLI_MODEL:-Xenova/nli-deberta-v3-small}  # DeBERTa-v3 NLI cross-encoder in ONNX (#229)
      HF_HOME: /data/hf                                  # cache the NLI model on a volume so it isn't re-downloaded each deploy (#229)
      MAAT_OWNERSHIP_LOOKUP: ${MAAT_OWNERSHIP_LOOKUP:-1}  # auto-resolve source ownership from Wikidata (#254); resolved owners are surfaced + overridable on /sources
      # Analyse surface (P14 #365): a publisher pasted into maat.press/analyse with no track
      # record is REGISTERED; this bounds how many registered sources the registry pass
      # auto-backfills per tick (the existing #241 review: pull its history → score it).
      # #417: was 2 — the registry kept auto-backfilling 100 articles/source/tick INTO a corpus
      # whose engine was dead, growing N (and so the failed allocation) for zero benefit. Held at 0
      # while corroborate is off; restore to 2 when the engine is armed.
      MAAT_BACKFILL_ON_REGISTER: ${MAAT_BACKFILL_ON_REGISTER:-0}
      MAAT_TRANSLATE_TITLES: ${MAAT_TRANSLATE_TITLES:-1}  # English gloss for non-English feed titles (#54), display-only
      # Intake pause (cauri, 2026-06): PAUSED by default while the console v2 is iterated — the
      # acquire steps below are skipped, but processing (corroborate, story-graph, grounding,
      # harvest…) keeps running so existing data matures. Resume with MAAT_INTAKE_PAUSED=0 in the
      # box .env (or flip this default) + redeploy.
      MAAT_INTAKE_PAUSED: ${MAAT_INTAKE_PAUSED:-1}
    # #417: was a 13-step serial `sh -c 'while true; do STEP || echo "…error"; done'` loop. That
    # shape caused the outage three ways: no step had a TIMEOUT (a contradiction hang deadlocked
    # every later step AND every future tick — corroborate wasn't even retried); `|| echo` laundered
    # every crash to exit 0 (corroborate OOM'd for 27 days in silence); and `while true` as PID 1
    # meant the container could never exit, so `restart: unless-stopped` was dead code.
    # scripts/clock_supervisor.py owns the loop now: hard per-step timeout, per-step outcome written
    # to a status file, gated steps, and a real non-zero exit on supervisor failure.
    command: ["uv", "run", "--no-dev", "python", "scripts/clock_supervisor.py"]
    healthcheck:
      # The clock is the ONE pipeline service that had no healthcheck — and a process-liveness check
      # wouldn't have helped anyway: the hung process was alive, just doing nothing. So check WORK,
      # not breath: the supervisor touches this file at the end of every tick. Stale ⇒ unhealthy.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/clock_heartbeat 2>/dev/null || echo 0) )) -lt $$(( ${MAAT_TICK_INTERVAL:-10800} * 2 + 1800 ))"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    mem_limit: 3g        # #417: an unbounded agent OOM'd the whole box twice; contain the blast
    mem_reservation: 512m
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      kerneld:
        condition: service_started
      extract:
        condition: service_started
      classify:
        condition: service_started
    volumes:
      - hfcache:/data/hf   # NLI model cache (#229) — persists across deploys

  # Pipeline watchdog (#417) — the mouth the detector never had.
  #
  # obs_metrics.stage_health was ALREADY correct: it maps cluster -> cluster.corroborated with a 24h
  # stalled bar, and fed today's data it says "last ran 656h ago". It never fired because its only
  # caller was an HTTP handler behind WireGuard + Google OAuth — Maat's whole liveness story ended in
  # an act of human attention, and the operator was busy for a month. That is the normal case.
  #
  # This is its OWN service on purpose: the clock is exactly the thing that fails, so the reporter
  # must not live inside it. It checks each stage independently (an aggregate max() across event
  # types is what let live ingestion mask a 27-day-dead cluster stage) and PUSHES out: it pings a
  # dead-man's switch only while healthy, so if the box, the DB, or the watchdog itself dies, the
  # pings stop and the external monitor pages you. A heartbeat that must be STARVED to fire is the
  # only kind that survives its own author crashing.
  watchdog:
    image: maat-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-maat}:${POSTGRES_PASSWORD:-maat}@postgres:5432/${POSTGRES_DB:-maat}"
      MAAT_WATCHDOG_INTERVAL: ${MAAT_WATCHDOG_INTERVAL:-900}   # 15 min
      # SET THESE or the watchdog can only log — which is precisely what failed for 27 days.
      # MAAT_HEARTBEAT_URL: dead-man's switch (healthchecks.io / Better Stack) — the one that
      #   survives the box vanishing entirely. MAAT_ALERT_WEBHOOK: Slack/Discord for the detail.
      MAAT_HEARTBEAT_URL: ${MAAT_HEARTBEAT_URL:-}
      MAAT_ALERT_WEBHOOK: ${MAAT_ALERT_WEBHOOK:-}
      # The gates the watchdog needs to tell "broken" from "switched off" (#419). It cannot read the
      # clock's environment, so without these it alerted CRITICAL on four deliberately-paused stages
      # every 15 minutes, forever — an alarm that always fires, which is its own kind of outage.
      # These MUST carry the same defaults as the acquisition-clock above: if the two disagree, the
      # watchdog is describing a machine that doesn't exist. Suppression needs an explicit "0"/"1",
      # so a dropped variable here alerts rather than silently muting the alarm.
      MAAT_INTAKE_PAUSED: ${MAAT_INTAKE_PAUSED:-1}
      MAAT_CORROBORATE_ENABLED: ${MAAT_CORROBORATE_ENABLED:-0}
    command: ["uv", "run", "--no-dev", "python", "scripts/watchdog.py"]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  reader:
    build: ./python
    image: maat-app:local
    restart: unless-stopped
    # Same .env as the pipeline services: the "Run the pipeline" button (Activity) shells out to
    # the acquire + corroborate jobs, so the reader needs MAAT_TOPICS / APIFY_API_KEY / etc. too.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-maat}:${POSTGRES_PASSWORD:-maat}@postgres:5432/${POSTGRES_DB:-maat}"
      # The admin console (P8, #82) publishes corrections to NATS; without this the reader
      # hit localhost:4222 and crash-looped. Point it at the compose nats service.
      NATS_URL: "nats://nats:4222"
      # Mark prod: the console fails CLOSED if the MAAT_ADMIN_* secrets are ever absent (#282),
      # refusing to boot rather than serving an unauthenticated console behind WireGuard alone.
      MAAT_ENV: "prod"
      # The console's prompt-chat agent (#158) — and any console-side LLM/embedding calls — read
      # these from the box's .env (same place POSTGRES_* come from). Values never touch the repo;
      # without them the chat degrades to "unavailable" rather than crashing.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      # Personal-feed topic enrichment ON (cauri sign-off, #189): ?topics= expands each interest
      # via SONNET (cauri: quality over the cheap tier), MEMOISED per interest so it's one call per
      # new interest, not per request (serving.topics.enriched_interest). Set to 0 → pure keyword filter.
      MAAT_TOPICS_LLM: "${MAAT_TOPICS_LLM:-1}"
      # Daily spend cap for operator-triggered pipeline runs (#195, cauri: default $5/day). The
      # console refuses to start a run once today's estimated LLM spend reaches this; set to 0 to
      # disable the gate (uncapped).
      MAAT_DAILY_CAP_USD: "${MAAT_DAILY_CAP_USD:-5}"
      # So translate + prompt-chat spans export, and /eval shows "receiving traces" + cat-cafe link.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://cat-cafe:4318"
      # Admin-console auth (P8, #163; D31/D32) — Google OIDC + allowlist, SEPARATE from user auth.
      # All empty by default → admin auth stays DISABLED (console unauthenticated) until these land
      # in the box .env. Set them there (never in the repo); MAAT_ADMIN_SESSION_SECRET=$(openssl rand -hex 32).
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      MAAT_ADMIN_EMAILS: "${MAAT_ADMIN_EMAILS:-}"
      MAAT_ADMIN_SESSION_SECRET: "${MAAT_ADMIN_SESSION_SECRET:-}"
      MAAT_ADMIN_REDIRECT_URI: "${MAAT_ADMIN_REDIRECT_URI:-https://admin.maat.press/admin/callback}"
      MAAT_ADMIN_HD: "${MAAT_ADMIN_HD:-}"
    # Loopback only: host-network Caddy reaches it at 127.0.0.1:8000; the host port is bound to
    # 127.0.0.1 for SSH-tunnel break-glass. NOT published to the internet (closes the open :8000).
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Operator console v2 (D33/#292): the Next.js UI served at admin.maat.press. Caddy routes the UI
  # here and keeps /admin/*, /api/*, /console/api/* on the reader (FastAPI) — both verify the same
  # `maat_admin` cookie. Server-side calls (Sia's tools, the persona fetch, SSR) reach the
  # command/query API in-cluster at http://reader:8000; the browser uses same-origin /console/api/*.
  # env_file carries MAAT_ADMIN_SESSION_SECRET (cookie verify), ANTHROPIC_API_KEY (Sia), and any
  # ANTHROPIC_BASE_URL (normalised to /v1 in lib/sia.ts) from the box .env.
  console:
    build: ./console
    image: maat-console:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CONSOLE_API_INTERNAL: "http://reader:8000"
    # Loopback only: host-network Caddy reaches it at 127.0.0.1:3100 (WG-gated at the edge).
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - reader

  # Public marketing site (www.maat.press): the landing page + the acquisition funnel. A SEPARATE
  # app from the behind-the-box reader/console — they share only the bus + DB. It publishes
  # acquisition.* events (tenant_id=public) that maat-kerneld folds for the console's /acquisition
  # page; it never touches Postgres directly, so it needs only NATS (no DB, no LLM keys, no OTEL).
  # Reuses the maat-app:local image the reader builds. Bound to 127.0.0.1:8080 so the host-network
  # Caddy reaches it over the loopback (www.maat.press vhost) — never published to the open net.
  marketing:
    image: maat-app:local
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
    command: ["uv", "run", "--no-dev", "uvicorn", "maat.marketing.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nats:
        condition: service_healthy

  # Public site (maat.press/analyse, P14 #365): the Analyse surface — Maat's product page on the
  # open web (likely to replace the marketing landing page as the apex front door). Next.js
  # standalone, loopback-only; Caddy routes maat.press/analyse* (+ /_next assets) here and
  # maat.press/api/analyse* to the reader, so the page and its API are same-origin (no CORS).
  site:
    build: ./site
    image: maat-site:local
    restart: unless-stopped
    environment:
      # Server-side reads (card image render + per-analysis OG metadata) hit the reader in-cluster,
      # not back out through Caddy. Public origin is used to build absolute OG image URLs.
      SITE_API_INTERNAL: "http://reader:8000"
      SITE_PUBLIC_ORIGIN: "${SITE_PUBLIC_ORIGIN:-https://maat.press}"
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      - reader

  # cat-cafe (#32) — LLM observability + spend sink. The pipeline exports OTLP spans here (model +
  # token usage per call → cost). UI is admin-only on loopback (reach it like the reader console,
  # via `ssh -L 8800:localhost:8800`); OTLP :4318 stays internal on the compose network. The
  # console's /eval page links to it ("open cat-cafe ↗", CATCAFE_URL default http://localhost:8800).
  cat-cafe:
    image: artiumai/cat-cafe:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:8000"   # UI — SSH-tunnel only, never public
    volumes:
      # Persist the Badger trace store (spend history) across redeploys — without this, every
      # merge-to-main recreates the container and resets the spend view to zero.
      - catcafedata:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    # HOST networking (not published ports): so the admin vhost's `remote_ip` matcher sees the
    # real WireGuard source IP (a bridge + port-map would masquerade it to the docker gateway).
    # Caddy binds the host's :80/:443 directly — including on the wg0 interface (10.8.0.1).
    network_mode: host
    environment:
      # Public API hostname — a real domain whose A-record points at this box (api.maat.press).
      MAAT_HOST: ${MAAT_HOST:?set MAAT_HOST to the public API hostname (e.g. api.maat.press)}
      # Operator-console hostname (public A-record + WG-gated serving, D32) and the WG subnet
      # the console is served to. Defaults match deploy/wireguard.sh.
      MAAT_ADMIN_HOST: ${MAAT_ADMIN_HOST:-admin.maat.press}
      MAAT_WG_SUBNET: ${MAAT_WG_SUBNET:-10.8.0.0/24}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - reader
      - marketing
      - console
      - site

volumes:
  pgdata:
  natsdata:
  caddydata:
  caddyconfig:
  catcafedata:
  hfcache:
